  // When it's opened from a computer on the same Wi-Fi, problems are also reported back to that computer.
  (function () {
    var problems = [];

    }, true);
    window.addEventListener("unhandledrejection", function (e) {

      var box = document.createElement("div");
      box.className = "stuck";

  })();
